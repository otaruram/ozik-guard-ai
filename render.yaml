services:
  - type: web
    name: ozik-guard-api
    env: go
    buildCommand: cd backend && go build -o main ./cmd/api
    startCommand: cd backend && ./main
    envVars:
      - key: PORT
        value: 8080
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
